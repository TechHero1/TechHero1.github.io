<!DOCTYPE HTML>
<html>
<head>
    <meta http-equiv="Content-Type" content="text/html; charset=UTF-8"/>
	<meta name="viewport" content="width=device-width, height=device-height, initial-scale=1, maximum-scale=1, user-scalable=no" />
    <script type="text/javascript" src="script.js"></script>
</head>
<body>
    <button onclick="add('bold');select_field(this,false);update_preview()">adicionar bold</button>
    <button onclick="add('italic');select_field(this,false);update_preview()">adicionar italic</button>
    <button onclick="add('hr');select_field(this,false);update_preview()">adicionar divisória</button>
    <button onclick="add('color');select_field(this,false);update_preview()">adicionar cor</button>
    <br><br>
    <textarea onfocus="select_field(this, true)" onblur="select_field(this,false)" onclick="set_selection(this.selectionStart,this.selectionEnd)" onselect="set_selection(this.selectionStart,this.selectionEnd)" oninput="set_selection(this.selectionStart,this.selectionEnd);update_preview()" style="width: 800px; height: 100px;" class="nota_input"></textarea>
    <script>
        document.querySelector(".nota_input").addEventListener("keypress", function(event) {
            if (event.key === "Enter") {
                //console.log("enter")
                event.preventDefault();
                //document.querySelector(".nota_input").value += "\\n";
                add("newline");
                update_preview();
            }
        });
    </script>
    <br><br>
    <div class="preview" style="width: 800px; height: 100px;"></div>
</body>
