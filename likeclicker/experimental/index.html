<!DOCTYPE HTML>
<html>
<head>
    <meta http-equiv="Content-Type" content="text/html; charset=UTF-8"/>
	<meta name="viewport" content="width=device-width, height=device-height, initial-scale=1, maximum-scale=1, user-scalable=no" />
    <script type="text/javascript" src="data/shop_items.js"></script>
    <script type="text/javascript" src="data/strings.js"></script>
    <script type="text/javascript" src="script.js"></script>
    <link rel="stylesheet" type="text/css" href="style.css" media="all" />
</head>
<body onload="start()">
    <center>
        <h2>Like Clicker Experiment</h2>
        <div>
            <span>set lang</span>
            <div class="lang_buttons_area"></div>
        </div>
        <br>
        <div>
            <span>item id</span>
            <input id="item_name" type="text">
            <br>
            <button onclick="add_shop_item(document.querySelector('#item_name').value)">add</button>
            <button onclick="add_double_item(document.querySelector('#item_name').value)">add double</button>
            <button onclick="add_lpc_item()">add lpc</button>
            <br>
            <span class="ids_list">valid ids: </span>
            <br>
            <br>
            <span>number for string</span>
            <input id="string_number" type="number">
            <br>
            <button onclick="let number = document.querySelector('#string_number').value;if(number > 1){create_new_toast(get_string('test','plural',[number]),30)}else{create_new_toast(get_string('test','singular',[number]),30)}">test string</button><br>
            <br>
            <span>your favorite words</span>
            <input id="string_word1" type="text">
            <input id="string_word2" type="text">
            <br>
            <button onclick="let word1 = document.querySelector('#string_word1').value;let word2 = document.querySelector('#string_word2').value;if(word1 == '' || word2 == '' || word1 == word2){create_new_toast(get_string('creative','',[]),30)}else{create_new_toast(get_string('words','',[word1,word2]),30)}">test string</button>
            <br>
            <br>
            <div class="shop_items_area"></div>
        </div>
    </center>
    <div class="toasts_container" style="position: absolute; right: 0; bottom: 0;" onmouseover="mouse_hovering_on_toasts = true" onmouseout="mouse_hovering_on_toasts = false"></div>
</body>
