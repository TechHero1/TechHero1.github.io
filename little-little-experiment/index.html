<head>
    <script>
        const original_list = [
            {
                "nome": "item1",
                "lastedited": "400"
            },
            {
                "nome": "item2",
                "lastedited": "600"
            },
            {
                "nome": "item3",
                "lastedited": "300"
            },
            {
                "nome": "item4",
                "lastedited": "700"
            },
            {
                "nome": "名探偵プリキュア！",
                "lastedited": "800"
            },
            {
                "nome": "item6",
                "lastedited": "100"
            },
            {
                "nome": "item7",
                "lastedited": "200"
            },
            {
                "nome": "item8",
                "lastedited": "500"
            },
            {
                "nome": "ablebo",
                "lastedited": "500"
            },
        ];

        var filtered_list = [];
        var manual_order = [];
        var temp_manual_order = [];

        function load_original_list() {
            document.querySelector("#original").innerHTML = "";
            for (var i = 0; i < original_list.length; i++) {
                document.querySelector("#original").innerHTML += `<p><b>${original_list[i].nome}</b><br>Última vez editado: ${original_list[i].lastedited}</p>`;
            }
        }

        function load() {
            load_original_list();
            filter_list("add","normal");
            load_filtrada_list();
        }

        function load_filtrada_list() {
            document.querySelector("#filtrada").innerHTML = "";
            for (var i = 0; i < filtered_list.length; i++) {
                document.querySelector("#filtrada").innerHTML += `<p><b>${filtered_list[i].nome}</b><br>Última vez editado: ${filtered_list[i].lastedited}</p>`;
            }
        }

        function filter_list(modo, ordem) {
            filtered_list = [];
            //MANUAL
            if (modo == "manual") {
                if (manual_order == "") {
                    for (var i = 0; i < original_list.length; i++) {
                        manual_order[i] = i;
                    }
                }
                filtered_list = manual_order.map(index => original_list[index]);
                load_filtrada_list();
                return;
            }

            //ADD
            if (modo == "add") {
                if (ordem == "normal") {
                    //ADD - CRESCENTE
                    filtered_list = original_list;
                    load_filtrada_list();
                    return;
                } else {
                    //ADD - DECRESCENTE
                    filtered_list = original_list.toReversed();
                    load_filtrada_list();
                    return;
                }
            }

            //EDIT
            if (modo == "edit") {
                if (ordem == "normal") {
                    //EDIT - CRESCENTE
                    filtered_list = original_list.toSorted((a, b) => a.lastedited - b.lastedited);
                    load_filtrada_list();
                    return;
                } else {
                    //EDIT - DECRESCENTE
                    filtered_list = original_list.toSorted((a, b) => b.lastedited - a.lastedited);
                    load_filtrada_list();
                    return;
                }
            }

            //ALPHABET
            if (modo == "alphabet") {
                if (ordem == "normal") {
                    //ALPHABET - CRESCENTE
                    filtered_list = original_list.toSorted((a, b) => a.nome.localeCompare(b.nome));
                    load_filtrada_list();
                    return;
                } else {
                    //ALPHABET - DECRESCENTE
                    filtered_list = original_list.toSorted((a, b) => b.nome.localeCompare(a.nome));
                    load_filtrada_list();
                    return;
                }
            }
        }

        function change_page(page) {
            document.querySelector("#mainPage").style.display = "none";
            document.querySelector("#manualPage").style.display = "none";

            document.querySelector("#"+page).style.display = "block";

            load_manual_to_edit();
        }

        function load_manual_to_edit(list=[]) {
            temp_manual_order = list;
            //se list vazio = carregando, se não = recarregando
            if (list == "") {
                if (manual_order == "") {
                    for (var i = 0; i < original_list.length; i++) {
                        temp_manual_order[i] = i;
                    }
                    manual_order = temp_manual_order;
                } else {
                    temp_manual_order = manual_order;
                }
            }
            
            let temp_editing_list = temp_manual_order.map(index => original_list[index]);
            document.querySelector("#manual_edit").innerHTML = "";
            for (var i = 0; i < temp_editing_list.length; i++) {
                document.querySelector("#manual_edit").innerHTML += `
                    <div style="display:flex;flex-direction:row;place-items:center;gap:5px;padding-left: 5px;padding-top: 5px;padding-bottom: 5px;">
                        <div style="display:flex;flex-direction:column;width:fit-content;gap:2px;">
                            <button onclick="change_manual_item([${temp_manual_order}],${i},${i-1})">🞁</button>
                            <button onclick="change_manual_item([${temp_manual_order}],${i},${i+1})">🞃</button>
                        </div>
                        <div style="display:flex;flex-direction:row;width:fit-content;gap:2px;">
                            <input id="input-${i}" value="${i+1}" onchange="change_manual_item([${temp_manual_order}],${i},this.value-1)">
                        </div>
                        <b>${temp_editing_list[i].nome}</b>
                    </div>`;
            }
        }

        function change_manual_item(order,current_id,new_id) {
            if (new_id < 0) return;
            if (new_id > order.length) return;

            console.log(`try in ${order} -> ${order[current_id]} (item of id ${current_id}) to ${new_id}`);

            let original1 = order.slice(0, current_id);
            let original2 = order.slice(current_id+1, order.length);
            console.log(`original order: [${original1} <this> ${original2}]`);

            let new_order = original1.concat(original2);

            let part1;
            let part2;

            part1 = new_order.slice(0, new_id);
            part2 = new_order.slice(new_id, new_order.length);

            console.log(`modified order: [${part1} <this> ${part2}]`);

            part1.push(order[current_id]);
            new_order = part1.concat(part2);
            console.log("new "+new_order);
            console.log();
            load_manual_to_edit(new_order);
        }

        function save_manual_order() {
            manual_order = temp_manual_order;

            change_page('mainPage');
            filter_list('manual','');
        }
    </script>
</head>

<body onload="load()">
    <div id="mainPage">
        <b>Lista original</b>
        <div id="original" style="border: 1px solid black">
        
        </div>

        <br><br>

        <b>Lista filtrada</b>
        <div style="display: flex; gap: 5px;">
            <button onclick="change_page('manualPage')">Editar Manual</button>
            <div style="width: 15px;"></div>
            <button onclick="filter_list('manual','')">Manual</button>
            <div style="width: 15px;"></div>
            <button onclick="filter_list('add','normal')">Adição (crescente)</button>
            <button onclick="filter_list('add','inverso')">Adição (decrescente)</button>
            <div style="width: 15px;"></div>
            <button onclick="filter_list('edit','normal')">Edição (crescente)</button>
            <button onclick="filter_list('edit','inverso')">Edição (decrescente)</button>
            <div style="width: 15px;"></div>
            <button onclick="filter_list('alphabet','normal')">Ordem alfabética (crescente)</button>
            <button onclick="filter_list('alphabet','inverso')">Ordem alfabética (decrescente)</button>
        </div>
        <div id="filtrada" style="border: 1px solid black">
        
        </div>
    </div>
    <div id="manualPage" style="display:none">
        <div style="display: flex; gap: 5px;">
            <button onclick="change_page('mainPage')">Cancelar</button>
            <div style="width: 15px;"></div>
            <button onclick="save_manual_order()">Salvar</button>
        </div>
        <div id="manual_edit" style="border: 1px solid black">
            
        </div>
    </div>
</body>
